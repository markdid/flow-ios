name: iOS build and package tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Standard GitHub-hosted runner; no larger/paid runner or signing secrets.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test portable core (debug)
        run: swift test --package-path FlowCore
      - name: Test portable core (release)
        run: swift test -c release --package-path FlowCore
      - name: Compile and test dormant solver gates on Apple platforms
        run: swift test --package-path Experimental/FlowSignatureSolver
      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build iOS simulator app (unsigned)
        run: >-
          xcodebuild -project FlowPrototype.xcodeproj
          -scheme FlowPrototype -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -configuration Debug -derivedDataPath DerivedData
          CODE_SIGNING_ALLOWED=NO build
      - name: Select an available iPhone simulator
        run: |
          xcrun simctl list devices available -j > /tmp/flow-simulators.json
          python3 - <<'PYTHON'
          import json, os
          data = json.load(open('/tmp/flow-simulators.json'))
          phones = [d for runtime, devices in data['devices'].items() if 'iOS' in runtime
                    for d in devices if d.get('isAvailable') and d['name'].startswith('iPhone')]
          if not phones:
              raise SystemExit('No available iPhone simulator')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('FLOW_SIMULATOR=' + phones[0]['udid'] + '\n')
          PYTHON
      - name: Run bounded simulator UI smoke and official-player observation
        timeout-minutes: 12
        run: >-
          xcodebuild -project FlowPrototype.xcodeproj -scheme FlowPrototype
          -destination "platform=iOS Simulator,id=$FLOW_SIMULATOR"
          -configuration Debug -derivedDataPath DerivedData
          -resultBundlePath SmokeResults.xcresult
          -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test
      - name: Preserve simulator test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-smoke-evidence
          path: SmokeResults.xcresult
          retention-days: 3
          if-no-files-found: ignore
