name: FlowPrototype
options:
  deploymentTarget:
    iOS: '16.0'
packages:
  FlowCore:
    path: FlowCore
settings:
  base:
    SWIFT_VERSION: '5.0'
    PRODUCT_BUNDLE_IDENTIFIER: org.example.flowprototype
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_CFBundleDisplayName: Flow Prototype
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  FlowPrototype:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: FlowCore
schemes:
  FlowPrototype:
    build:
      targets:
        FlowPrototype: all
